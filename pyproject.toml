[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "localai"
version = "0.1.0"
description = "Yerel (Ollama) + bulut (Claude) hibrit kodlama asistanı"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["anthropic>=1.13,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
localai = "localai.cli:main"

[tool.setuptools.packages.find]
include = ["localai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
