# Bu dosyayı projenin köküne "localai.toml" adıyla ya da
# ~/.localai/config.toml olarak kopyala. Tüm alanlar isteğe bağlı.
# Her alan ortam değişkeniyle de verilebilir: LOCALAI_<ALAN_ADI> (ör. LOCALAI_LOCAL_MODEL)

# --- Yerel model (Ollama) ---
local_model = "qwen2.5-coder:7b"
ollama_host = "http://127.0.0.1:11434"
# Bağlam penceresi (token). 8 GB VRAM için 8192-16384 makul.
num_ctx = 16384
# Araç çıktılarının (dosya, komut) en fazla kaç karakteri modele gönderilsin
local_tool_output_chars = 6000

# --- Bulut model (Claude API, ANTHROPIC_API_KEY gerekir) ---
cloud_model = "claude-opus-5-5"   # daha ucuz: "claude-sonnet-5-5"
effort = "high"                   # low | medium | high | xhigh | max (düşük = daha az token)
cloud_tool_output_chars = 30000
# Aylık bulut harcama sınırı (dolar). 0 = bulutu kapat, -1 = sınırsız
monthly_budget_usd = 5.0

# --- Genel ---
mode = "auto"         # auto | local | cloud
max_steps = 25        # bir görevde en fazla kaç model adımı
auto_approve = false  # true: dosya yazma ve komut çalıştırma için onay sorma

# =====================================================================
# Orkestra: Claude Code + Antigravity + yerel model birlikte çalışır
# (localai orkestra ... komutları). Tüm alanlar isteğe bağlı.
# =====================================================================
[orkestra]
# Claude Code: bilgisayarında kurulu ve aboneliğinle giriş yapılmış `claude` komutu
claude_enabled = true
claude_command = ["claude"]
claude_model = ""            # boş = hesabının varsayılanı; ör. "sonnet" kotayı daha yavaş tüketir

# Antigravity CLI (`agy`). Önce bir kez elle `agy` çalıştırıp giriş yap.
antigravity_enabled = true
antigravity_command = ["agy"]
antigravity_model = ""
# Antigravity'nin dosya düzenleyebilmesi için (başsız modda onay soracak kimse yok):
#   antigravity_extra_args = ["--dangerously-skip-permissions"]
#   antigravity_can_edit = true
# Kapalıyken Antigravity sadece planlar ve denetler.
antigravity_extra_args = []
antigravity_can_edit = false

local_enabled = true          # basit işler için ücretsiz yerel model (Ollama)

check_command = ""            # her işten sonra çalışacak test, ör. "python -m pytest -q" veya "npm test"
max_attempts = 3
integration_branch = "orkestra"   # onaylanan işler burada birikir; ana dalına sen birleştirirsin
task_timeout_min = 30
default_cooldown_min = 30     # limit doldu ama sıfırlanma saati yazmıyorsa bekleme süresi
poll_seconds = 10

# Kredi dağıtımı: hangi aboneliğe ne kadar iş gitsin (yüksek = daha çok)
claude_weight = 1.0
antigravity_weight = 1.0
balance_window_hours = 5.0
